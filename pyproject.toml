[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "picme"
version = "0.1.0"
description = "AIポートレート自動レタッチソフト (EVOTO AI 風の一括自動補正)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "Pillow>=10.0",
    "mediapipe>=0.10.14",
]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
raw = ["rawpy>=0.19"]
heif = ["pillow-heif>=0.16"]
all = ["PySide6>=6.5", "rawpy>=0.19", "pillow-heif>=0.16"]
dev = ["pytest>=7"]

[project.scripts]
picme = "picme.cli:main"
picme-gui = "picme.gui.app:main"

[tool.setuptools.packages.find]
include = ["picme*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
